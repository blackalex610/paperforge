[project]
name = "paperforge"
version = "1.0.0"
description = "Procedural, self-verifying generator for Bulgaria's national 7th-grade mathematics exam (НВО)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paperforge = "paperforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
